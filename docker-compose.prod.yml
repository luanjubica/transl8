version: '3.8'

# Production docker-compose configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-transl8}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-transl8}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transl8}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transl8-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Redis
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transl8-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/sh -c "chmod +x /app/scripts/start-api.sh && /app/scripts/start-api.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - transl8-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Celery Workers
  worker-parsing:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    restart: always
    environment:
      - ENVIRONMENT=production
      - CELERY_QUEUES=parsing
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/sh -c "chmod +x /app/scripts/start-worker.sh && /app/scripts/start-worker.sh"
    networks:
      - transl8-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  worker-translation:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    restart: always
    environment:
      - ENVIRONMENT=production
      - CELERY_QUEUES=translation
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/sh -c "chmod +x /app/scripts/start-worker.sh && /app/scripts/start-worker.sh"
    networks:
      - transl8-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

  worker-export:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    restart: always
    environment:
      - ENVIRONMENT=production
      - CELERY_QUEUES=export
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/sh -c "chmod +x /app/scripts/start-worker.sh && /app/scripts/start-worker.sh"
    networks:
      - transl8-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # Celery Beat
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    restart: always
    environment:
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env.production
    depends_on:
      redis:
        condition: service_healthy
    command: /bin/sh -c "chmod +x /app/scripts/start-beat.sh && /app/scripts/start-beat.sh"
    networks:
      - transl8-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Nginx (Reverse Proxy + Load Balancer)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - transl8-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  transl8-network:
    driver: bridge
